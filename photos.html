<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Photos 📸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#28051e,#070008 65%);color:#fff;font-family:Quicksand,sans-serif;padding:70px 22px}
.wrap{max-width:950px;margin:auto;text-align:center}.eyebrow{font-family:Cormorant Garamond,serif;font-style:italic;color:#ffc8df;letter-spacing:3px}
h1{font:600 clamp(2.4rem,7vw,4.5rem) Cormorant Garamond,serif;margin:10px 0}.intro{opacity:.7;max-width:560px;margin:0 auto 45px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{width:100%;min-width:0;max-width:100%;aspect-ratio:1/1;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.15);box-shadow:0 15px 45px rgba(0,0,0,.35);background:#180916}.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.card:hover img{transform:scale(1.06)}
.back{display:inline-block;margin-top:40px;padding:13px 25px;border:1px solid rgba(255,255,255,.2);border-radius:30px;color:#fff;text-decoration:none;background:rgba(255,255,255,.06)}
@media(max-width:700px){body{padding:50px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
</style>
</head>
<body><main class="wrap">
<p class="eyebrow">little pieces of us</p><h1>Our Photos 📸</h1>
<p class="intro">A tiny gallery of the moments that deserve their own little corner of the universe.</p>
<div class="grid">
<img class="card" src="images/photos/pic02.jpg" alt="A favorite photo">
<img class="card" src="images/photos/pic04.jpg" alt="A favorite photo">
<img class="card" src="images/photos/pic06.jpg" alt="A favorite photo">
<img class="card" src="images/photos/pic08.jpg" alt="A favorite photo">
<img class="card" src="images/photos/pic10.jpg" alt="A favorite photo">
<img class="card" src="images/photos/pic01.jpg" alt="A favorite photo">
</div>
<a class="back" href="index.html">← Back to the universe</a>
</main></body></html>
